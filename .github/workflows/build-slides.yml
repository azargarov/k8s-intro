name: Build slides

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-slides:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Generate slides.md
        run: python3 tools/build_slides.py

      - name: Build PDF
        run: |
          marp slides.md \
            --pdf \
            --allow-local-files \
            --output slides.pdf

      - name: Upload slides.md
        uses: actions/upload-artifact@v4
        with:
          name: slides-md
          path: slides.md

      - name: Upload slides.pdf
        uses: actions/upload-artifact@v4
        with:
          name: slides-pdf
          path: slides.pdf
      
      - name: Build HTML
        run: |
          marp slides.md \
            --html \
            --allow-local-files \
            --output slides.html

      - name: Upload slides.html
        uses: actions/upload-artifact@v4
        with:
          name: slides-html
          path: slides.html